# Server
server.port=8080

# MySQL
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/gocomet_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USERNAME:gocomet}
spring.datasource.password=${MYSQL_PASSWORD:gocomet}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false

# CORS
cors.allowed-origins=http://localhost:3000

# New Relic (fill your license key)
newrelic.app_name=GoComet-RideHailing
newrelic.license_key=YOUR_NEW_RELIC_LICENSE_KEY

# Logging
logging.level.com.gocomet=INFO
